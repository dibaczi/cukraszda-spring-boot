<!DOCTYPE html><html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRUD – Admin | Cukrászda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/custom.css}"></head><body>
<div th:replace="~{fragments/menu :: menu}"></div><main class="container">
<p class="text-uppercase text-primary small tracking">Csak adminisztrátoroknak</p>
<h1>Sütemények kezelése</h1><p>Teljes CRUD: létrehozás, megtekintés, módosítás és törlés.</p>
<div th:if="${siker}" class="alert alert-success" th:text="${siker}"></div>
<a class="btn btn-primary mb-3" th:href="@{/crud/uj}">+ Új sütemény hozzáadása</a>
<div class="table-responsive"><table class="table table-hover table-striped align-middle">
  <thead><tr><th>ID</th><th>Név</th><th>Típus</th><th>Díjazott</th><th>Műveletek</th></tr></thead>
  <tbody><tr th:each="s : ${sutik}">
    <td th:text="${s.id}"></td><td th:text="${s.nev}"></td><td th:text="${s.tipus}"></td>
    <td th:text="${s.dijazott ? 'Igen' : 'Nem'}"></td>
    <td class="text-nowrap">
      <a class="btn btn-outline-primary btn-sm" th:href="@{/crud/szerkesztes/{id}(id=${s.id})}">Szerkesztés</a>
      <form th:action="@{/crud/torles/{id}(id=${s.id})}" method="post" class="d-inline"
            onsubmit="return confirm('Biztosan törlöd ezt a süteményt és a hozzá tartozó árakat/mentességeket?');">
        <button class="btn btn-outline-danger btn-sm" type="submit">Törlés</button>
      </form>
    </td>
  </tr></tbody>
</table></div>

</main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
