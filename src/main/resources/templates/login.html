<!DOCTYPE html><html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bejelentkezés | Cukrászda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/custom.css}"></head><body>
<div th:replace="~{fragments/menu :: menu}"></div><main class="container">
<h1>Bejelentkezés</h1>
<div class="alert alert-success" th:if="${param.registered}">Sikeres regisztráció, most már bejelentkezhetsz.</div>
<div class="alert alert-danger" th:if="${param.error}">Hibás felhasználónév vagy jelszó.</div>
<form th:action="@{/login}" method="post" class="narrow-form">
  <label class="form-label">Felhasználónév<input class="form-control" name="username" autocomplete="username" required></label>
  <label class="form-label">Jelszó<input type="password" class="form-control" name="password" autocomplete="current-password" required></label>
  <button class="btn btn-primary" type="submit">Bejelentkezés</button>
</form>
</main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
