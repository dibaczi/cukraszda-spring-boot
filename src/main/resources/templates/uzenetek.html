<!DOCTYPE html><html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Üzenetek | Cukrászda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/custom.css}"></head><body>
<div th:replace="~{fragments/menu :: menu}"></div><main class="container">
<p class="text-uppercase text-primary small tracking">Bejelentkezett felhasználóknak</p><h1>Beérkezett üzenetek</h1>
<p>A legújabb üzenet mindig legfelül látható.</p>
<div class="alert alert-info" th:if="${#lists.isEmpty(uzenetek)}">Még nem érkezett üzenet.</div>
<div class="table-responsive" th:unless="${#lists.isEmpty(uzenetek)}">
  <table class="table table-striped table-hover align-middle">
    <thead><tr><th>Dátum / idő</th><th>Feladó</th><th>E-mail</th><th>Üzenet</th></tr></thead>
    <tbody><tr th:each="u : ${uzenetek}">
      <td class="text-nowrap" th:text="${#temporals.format(u.kuldesIdeje,'yyyy.MM.dd. HH:mm')}"></td>
      <td th:text="${u.nev}"></td><td th:text="${u.email}"></td>
      <td class="wrap-text" th:text="${u.szoveg}"></td>
    </tr></tbody>
  </table>
</div>

</main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
