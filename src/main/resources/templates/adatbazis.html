<!DOCTYPE html><html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adatbázis | Cukrászda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/custom.css}"></head><body>
<div th:replace="~{fragments/menu :: menu}"></div><main class="container">
<h1>Adatbázis</h1><p>A tanári forrásadatok mindhárom táblája Spring Data JPA Repository-val betöltve.</p>
<h2 class="h4 mt-4">Sütemények</h2><div class="table-responsive"><table class="table table-striped table-hover"><thead><tr><th>ID</th><th>Név</th><th>Típus</th><th>Díjazott</th></tr></thead>
<tbody><tr th:each="s : ${sutik}"><td th:text="${s.id}"></td><td th:text="${s.nev}"></td><td th:text="${s.tipus}"></td><td th:text="${s.dijazott ? 'Igen' : 'Nem'}"></td></tr></tbody></table></div>
<h2 class="h4 mt-4">Árak</h2><div class="table-responsive"><table class="table table-striped"><thead><tr><th>ID</th><th>Sütemény ID</th><th>Ár (Ft)</th><th>Egység</th></tr></thead>
<tbody><tr th:each="a : ${arak}"><td th:text="${a.id}"></td><td th:text="${a.sutiId}"></td><td th:text="${a.ertek}"></td><td th:text="${a.egyseg}"></td></tr></tbody></table></div>
<h2 class="h4 mt-4">Mentességek</h2><div class="table-responsive"><table class="table table-striped"><thead><tr><th>ID</th><th>Sütemény ID</th><th>Kód</th></tr></thead>
<tbody><tr th:each="t : ${tartalmak}"><td th:text="${t.id}"></td><td th:text="${t.sutiId}"></td><td th:text="${t.mentes}"></td></tr></tbody></table></div>
</main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
