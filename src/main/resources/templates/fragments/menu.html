<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
  <nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4" aria-label="Főmenü">
    <div class="container">
      <a class="navbar-brand fw-bold" th:href="@{/}">🍰 Cukrászda</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false" aria-label="Menü megnyitása"><span class="navbar-toggler-icon"></span></button>
      <div id="mainMenu" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Főoldal</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/adatbazis}">Adatbázis</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/kapcsolat}">Kapcsolat</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/diagram}">Diagram</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/rest}">REST</a></li>
          <li sec:authorize="isAuthenticated()" class="nav-item"><a class="nav-link" th:href="@{/uzenetek}">Üzenetek</a></li>
          <li sec:authorize="hasRole('ADMIN')" class="nav-item"><a class="nav-link" th:href="@{/crud}">CRUD</a></li>
        </ul>
        <div sec:authorize="isAnonymous()" class="d-flex gap-2">
          <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Bejelentkezés</a>
          <a class="btn btn-light btn-sm" th:href="@{/register}">Regisztráció</a>
        </div>
        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
          <span class="text-white small" sec:authentication="name"></span>
          <form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-outline-light btn-sm">Kijelentkezés</button></form>
        </div>
      </div>
    </div>
  </nav>
</body>
</html>
