<!DOCTYPE html><html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regisztráció | Cukrászda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/custom.css}"></head><body>
<div th:replace="~{fragments/menu :: menu}"></div><main class="container">
<h1>Regisztráció</h1>
<form th:action="@{/register}" th:object="${registerForm}" method="post" class="narrow-form">
  <label class="form-label">Felhasználónév<input class="form-control" th:field="*{username}" autocomplete="username" required minlength="3"></label>
  <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
  <label class="form-label">Jelszó<input type="password" class="form-control" th:field="*{password}" autocomplete="new-password" required minlength="8"></label>
  <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
  <button class="btn btn-primary" type="submit">Regisztrálok</button>
</form>
</main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
