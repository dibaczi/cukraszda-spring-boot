<!DOCTYPE html><html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kapcsolat | Cukrászda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/custom.css}"></head><body>
<div th:replace="~{fragments/menu :: menu}"></div><main class="container">
<div class="row"><div class="col-lg-8 mx-auto">
  <p class="text-uppercase text-primary small tracking">Lépj velünk kapcsolatba</p>
  <h1>Kapcsolat</h1><p class="text-secondary">Kérdésed van a süteményekről? Küldj üzenetet!</p>
  <div class="alert alert-success" th:if="${param.sikeres}">Köszönjük! Az üzenet sikeresen elmentve.</div>
  <form th:action="@{/kapcsolat}" th:object="${uzenet}" method="post" class="form-card p-4 rounded-4 shadow-sm">
    <div class="mb-3"><label for="nev" class="form-label">Név</label>
      <input id="nev" class="form-control" type="text" th:field="*{nev}" maxlength="100" required>
      <p class="text-danger small" th:if="${#fields.hasErrors('nev')}" th:errors="*{nev}"></p></div>
    <div class="mb-3"><label for="email" class="form-label">E-mail</label>
      <input id="email" class="form-control" type="email" th:field="*{email}" maxlength="180" required>
      <p class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p></div>
    <div class="mb-3"><label for="szoveg" class="form-label">Üzeneted</label>
      <textarea id="szoveg" class="form-control" rows="6" th:field="*{szoveg}" maxlength="2000" required></textarea>
      <p class="text-danger small" th:if="${#fields.hasErrors('szoveg')}" th:errors="*{szoveg}"></p></div>
    <button type="submit" class="btn btn-primary">Üzenet küldése</button>
  </form>
  <p class="mt-3 text-muted small">A beküldött üzeneteket az alkalmazás az adatbázisban tárolja. Megtekintésük bejelentkezéshez kötött.</p>
</div></div>

</main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
