<!DOCTYPE html><html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sütemény szerkesztése | Cukrászda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/custom.css}"></head><body>
<div th:replace="~{fragments/menu :: menu}"></div><main class="container">
<div class="row"><div class="col-md-8 col-lg-6 mx-auto">
  <h1 th:text="${urlapCim}">Sütemény adatai</h1>
  <form th:action="@{/crud/mentes}" th:object="${suti}" method="post" class="form-card rounded-4 shadow-sm p-4">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3"><label class="form-label" for="nev">Név</label>
      <input id="nev" class="form-control" type="text" th:field="*{nev}" required maxlength="150">
      <p class="text-danger small" th:if="${#fields.hasErrors('nev')}" th:errors="*{nev}"></p></div>
    <div class="mb-3"><label class="form-label" for="tipus">Típus</label>
      <input id="tipus" class="form-control" type="text" th:field="*{tipus}" required maxlength="100">
      <p class="text-danger small" th:if="${#fields.hasErrors('tipus')}" th:errors="*{tipus}"></p></div>
    <div class="form-check mb-3"><input id="dijazott" class="form-check-input" type="checkbox" th:field="*{dijazott}">
      <label for="dijazott" class="form-check-label">Díjazott sütemény</label></div>
    <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Mentés</button>
      <a class="btn btn-outline-secondary" th:href="@{/crud}">Mégsem</a></div>
  </form>
</div></div>

</main><div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
