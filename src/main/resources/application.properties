# Cukraszda - publikus, jelszomentes GitHub-konfiguracio.
# Helyben alapertelmezetten az XAMPP MariaDB cukraszda adatbazisat hasznalja.
# Az egyetemi Linuxhoz a DB_URL, DB_USER, DB_PASSWORD valtozokat a futasi kornyezetben add meg.
spring.application.name=cukraszda
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/cukraszda}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
# Kulso Tomcat eseteben a context-path-t a WAR neve hatarozza meg.
